seed: 513
device: auto

data:
  id_column: 影像组学序列号
  label_column: pCR
  depth: 64
  image_size: 64
  strict_slice_count: true
  external:
    ruijin:
      manifest: ../dataset/ruijin.txt
      metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/ruijin/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/ruijin/pet
    wuhan:
      manifest: ../dataset/wuhan.txt
      metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/wuhan/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/wuhan/pet
    FUSCC:
      manifest: ../dataset/FUSCC.txt
      metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/FUSCC/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/FUSCC/pet
    SPH_test:
      manifest: ../dataset/SPH_test.txt
      metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/SPH_test/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/SPH_test/pet
    france:
      manifest: ../dataset/france.txt
      metadata: /data4/zhenglujie/petct/PET_France/PETCT.xlsx
      id_column: 影像组学序列号
      label_column: pCR
      ct_root: /data4/zhenglujie/petct/robust_match_64_0.2_20/france/ct
      pet_root: /data4/zhenglujie/petct/robust_match_64_0.2_20/france/pet

model:
  name: fusion3d
  params: {num_classes: 2, dropout: 0.5, num_heads: 8, pretrained: false}

training:
  batch_size: 8
  num_workers: 4
  loss: {name: focal, alpha: 0.25, gamma: 2.0}

evaluate:
  task: checkpoint
  checkpoint: ../runs/fusion3d/best.pt
  output: ../runs/fusion3d/final_evaluation.json
  save_predictions: false
