# Five repeated stratified 70:30 holdouts, not disjoint five-fold cross-validation.
split:
  metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_SPH_radiomics-2025-8-14.xlsx
  id_column: 影像组学序列号
  label_column: pCR
  source_manifests:
    - ../dataset/train.txt
    - ../dataset/valid.txt
  mode: repeated_holdout
  repeats: 5
  validation_fraction: 0.3
  seed: 42
  output_directory: ../dataset/generated_splits_70_30_5repeats
  filename_pattern: 'repeat_{fold}_{split}.txt'
