# Conservative R3D-18 full fine-tuning. Run with the crossval command.
seed: 42
deterministic: true
device: cuda:0

data:
  id_column: 影像组学序列号
  label_column: pCR
  depth: 64
  image_size: 64
  strict_slice_count: true
  augment_probability: 0.5
  train:
    manifest: ../dataset/generated_splits_5fold/fold_{fold}_train.txt
    metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_SPH_radiomics-2025-8-14.xlsx
    ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/sph/ct
    pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/sph/pet
  validation:
    manifest: ../dataset/generated_splits_5fold/fold_{fold}_validation.txt
    metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_SPH_radiomics-2025-8-14.xlsx
    ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/sph/ct
    pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/sph/pet
  external:
    multi_hospital:
      members:
        wuhan:
          manifest: ../dataset/wuhan.txt
          metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
          ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/wuhan/ct
          pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/wuhan/pet
        ruijin:
          manifest: ../dataset/ruijin.txt
          metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
          ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/ruijin/ct
          pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/ruijin/pet
        FUSCC:
          manifest: ../dataset/FUSCC.txt
          metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
          ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/FUSCC/ct
          pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/FUSCC/pet
    france:
      manifest: ../dataset/france.txt
      metadata: /data4/zhenglujie/petct/PET_France/PETCT.xlsx
      id_column: 影像组学序列号
      label_column: pCR
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/france/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/france/pet
    SPH_test:
      manifest: ../dataset/SPH_test.txt
      metadata: /data4/zhenglujie/petct/PET_SPH_training_2025-4-8/PET_External_radiomics-2025-8-14.xlsx
      ct_root: /data4/zhenglujie/petct/clahed_64_0.2_20/SPH_test/ct
      pet_root: /data4/zhenglujie/petct/clahed_64_0.2_20/SPH_test/pet

model:
  name: fusion3d
  params:
    num_classes: 2
    pretrained: true
    backbone_trainable_stages: null  # null: full; []: frozen; [layer4]: last stage only.
    classifier_hidden_dim: 128
    dropout: 0.6
    num_heads: 8
    attention_dropout: 0.2

training:
  leakage_simulation:
    enabled: false
  epochs: 100
  batch_size: 8
  num_workers: 4
  pin_memory: true
  early_stopping_patience: 10
  optimizer:
    name: adamw
    learning_rate: 0.00003
    weight_decay: 0.001
  scheduler:
    factor: 0.2
    patience: 4
  loss:
    name: focal
    alpha: 0.25
    gamma: 2.0

cross_validation:
  folds: 5

evaluation:
  external_after_training: true
  external_selection: validation_best

output:
  save_training_predictions: true
  save_validation_predictions: true
  save_checkpoint: false
  root: ../runs
  run_name: fusion3d_regularized_full
  save_predictions: true
  save_prediction_ids: true
