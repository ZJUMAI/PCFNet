[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petct-research"
version = "1.0.0"
description = "Reproducible multimodal PET/CT classification workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "openpyxl>=3.1",
  "opencv-python-headless>=4.8",
  "SimpleITK>=2.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "torchio>=0.19",
]

[project.optional-dependencies]
hpo = ["optuna>=3.5"]
two-stage = ["lightgbm>=4.1", "xgboost>=2.0", "joblib>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
petct = "petct.cli:main"

[tool.setuptools.packages.find]
include = ["petct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
